<header class="ce-app-header">
  <a class="brand" href="/">{% include "_ce_logo.svg" %} CanvasExpert</a>
  <nav class="ce-app-nav" aria-label="Primary navigation">
    <a class="{% if request.url.path == '/' %}ce-app-nav--active{% endif %}" href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>CanvasAgent</a>
    <a class="{% if nav_section == 'names' %}ce-app-nav--active{% endif %}" href="/names"{% if nav_section == 'names' %} aria-current="page"{% endif %}>Names</a>
    <a class="{% if nav_section == 'settings' %}ce-app-nav--active{% endif %}" href="/settings"{% if nav_section == 'settings' %} aria-current="page"{% endif %}>Settings</a>
  </nav>
  <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme"><span class="toggle-track"><span class="toggle-thumb"></span><span class="toggle-icon toggle-icon--sun">☼</span><span class="toggle-icon toggle-icon--moon">☾</span></span></button>
</header>
